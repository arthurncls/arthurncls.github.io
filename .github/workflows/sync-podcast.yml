name: Sync podcast RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/sync-podcast.yml"

permissions:
  contents: write

concurrency:
  group: sync-podcast-rss
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch and convert RSS
        env:
          RSS_URL: "https://anchor.fm/s/11343344c/podcast/rss"
        run: |
          python - <<'PY'
          import os, json, re, html
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from datetime import datetime, timezone
          from pathlib import Path

          url = os.environ["RSS_URL"]
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 ArthurNicolasSite/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read()

          root = ET.fromstring(raw)
          channel = root.find("channel")
          if channel is None:
              raise SystemExit("RSS channel introuvable")

          itunes = "{http://www.itunes.com/dtds/podcast-1.0.dtd}"

          def text_of(item, name):
              el = item.find(name)
              return (el.text or "").strip() if el is not None and el.text else ""

          def clean(s, limit=240):
              s = html.unescape(re.sub(r"<[^>]+>", " ", s or ""))
              s = re.sub(r"\s+", " ", s).strip()
              return s if len(s) <= limit else s[:limit-1].rstrip() + "…"

          channel_image = ""
          channel_itunes = channel.find(itunes + "image")
          if channel_itunes is not None:
              channel_image = channel_itunes.attrib.get("href","")
          if not channel_image:
              image_node = channel.find("image")
              if image_node is not None:
                  channel_image = text_of(image_node, "url")

          episodes = []
          for item in channel.findall("item")[:8]:
              title = text_of(item, "title")
              description = text_of(item, "description")
              link = text_of(item, "link")
              pub = text_of(item, "pubDate")
              enclosure = item.find("enclosure")
              audio = enclosure.attrib.get("url","") if enclosure is not None else ""
              image_el = item.find(itunes + "image")
              image = image_el.attrib.get("href","") if image_el is not None else channel_image
              try:
                  published = parsedate_to_datetime(pub).astimezone(timezone.utc).isoformat()
              except Exception:
                  published = pub
              episodes.append({
                  "title": title,
                  "description": clean(description),
                  "link": link,
                  "audio": audio,
                  "image": image,
                  "published": published
              })

          path = Path("podcast-feed.json")
          old = {}
          if path.exists():
              try:
                  old = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  old = {}

          if old.get("episodes") == episodes:
              print("RSS inchangé")
              raise SystemExit(0)

          data = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "episodes": episodes
          }
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit feed if changed
        run: |
          if git diff --quiet -- podcast-feed.json; then
            echo "No RSS changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast-feed.json
          git commit -m "Met à jour le flux RSS du podcast"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "Impossible de publier le flux après 3 tentatives."
          exit 1
