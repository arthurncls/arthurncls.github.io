name: Build press kit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_press_kit.py"
      - ".github/workflows/build-press-kit.yml"

permissions:
  contents: write

concurrency:
  group: site-main-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install PDF dependencies
        run: python -m pip install --quiet reportlab pillow

      - name: Build PDF
        run: |
          mkdir -p assets/presse
          python scripts/build_press_kit.py

      - name: Commit press kit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/presse/kit-presse-arthur-nicolas.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
            exit 0
          fi
          git commit -m "Met à jour le kit presse PDF"
          git push origin HEAD:main
